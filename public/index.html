<!DOCTYPE html>
<html lang="en">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'ah-gold': '#D4AF37', 'ah-black': '#050505' },
                    fontFamily: { serif: ['Cinzel', 'serif'], sans: ['Montserrat', 'sans-serif'] }

    <style>
        body { background: #050505; color: #fff; overflow: hidden; cursor: crosshair; }
        .page { display: none; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; opacity: 0; }
        .active-page { display: flex; opacity: 1; }
        
        /* Premium Video Layering */
        .video-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -2; 
            filter: brightness(0.65) contrast(1.1); /* CLEAR VISIBILITY */
        }
        .overlay-vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%); z-index: -1;
        }

        /* Rolex-Style Scroll */
        .custom-scroll::-webkit-scrollbar { width: 2px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; }
        
        .product-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .product-card:hover {
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
            transform: translateY(-10px);
        }

        .nav-link { position: relative; }
        .nav-link::after {
            content: ''; position: absolute; bottom: -5px; left: 0;
            width: 0; height: 1px; background: #D4AF37;
            transition: width 0.4s ease;
        }
        .nav-link:hover::after { width: 100%; }
    </style>
</head>
<body class="antialiased" onclick="initAudio()">

        </video>

    <section id="page-products" class="page flex-col pt-32 px-12 overflow-hidden">

        <div class="flex justify-between items-end mb-12 border-b border-ah-gold/20 pb-6">

        </div>

        <div id="master-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8 overflow-y-auto custom-scroll pr-4 pb-32">
            </div>
    </section>

    <section id="page-chat" class="page flex-col items-center justify-center">
        <video class="video-bg" autoplay muted loop playsinline>
            <source src="/videos/Nibosi All Black Luxurious Elegant Watch _luxurywatchesformen _luxurywatch _elegantwatches(720P_HD).mp4" type="video/mp4">
        </video>
        <div class="overlay-vignette"></div>

        <div class="w-full max-w-4xl h-[75vh] glass-panel bg-black/60 backdrop-blur-3xl border border-ah-gold/20 rounded-sm flex flex-col shadow-2xl">
            <div class="p-8 border-b border-white/5 flex items-center justify-between">
                <div>
                    <h3 class="font-serif text-ah-gold text-xl tracking-[0.3em]">AI CONCIERGE</h3>
                    <p class="text-[9px] text-gray-500 font-sans tracking-[0.2em] uppercase mt-1">Direct Line to Al Haroon Intelligence</p>
                </div>
                <div class="w-3 h-3 bg-ah-gold rounded-full animate-ping"></div>
            </div>

            <div id="chat-window" class="flex-1 overflow-y-auto p-10 space-y-8 custom-scroll">
                <div class="bg-ah-gold/10 p-6 border-l-2 border-ah-gold max-w-[80%] font-sans text-sm leading-relaxed text-gray-300">
                    Good evening. I am your digital attaché. I have full knowledge of the vault. How may I assist your acquisition today?
                </div>
            </div>

            <div class="p-8">
                <div class="flex border-b border-ah-gold/30 focus-within:border-ah-gold transition-all pb-2 px-2">
                    <input type="text" id="ai-input" placeholder="Inquire about bespoke availability..." class="bg-transparent flex-1 outline-none text-sm text-white font-sans tracking-wide">
                    <button onclick="askVault()" class="text-ah-gold hover:text-white transition-colors tracking-[0.2em] font-serif text-xs px-4">SEND</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        // SYSTEM INSTRUCTIONS FOR AI
        const AI_SYSTEM = {
            key: "AIzaSyBNXxjv6I_HkwNhzAarMctQMeEN5Zwx0Jg",
            instruction: "You are the Al Haroon Luxury Concierge. Your tone is elite, formal, and mysterious. You never use emojis. You refer to products as 'Masterpieces'. If asked about prices, say 'Value is provided upon request for our private clients.' Keep answers under 3 sentences."
        };

        const inventory = [
            { id: 1, name: "ROYAL OYSTER", price: "$45,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1523170335258-f5ed11844a49?q=80&w=600" },
            { id: 2, name: "DAYTONA BLACK", price: "$62,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?q=80&w=600" },
            { id: 3, name: "SUBMARINER GOLD", price: "$38,500", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1547996663-b85580e932cd?q=80&w=600" },
            { id: 4, name: "SKY DWELLER", price: "$55,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1539874754764-5a96559165b0?q=80&w=600" },
            { id: 5, name: "NAUTILUS PURE", price: "$120,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?q=80&w=600" },
            { id: 6, name: "TANK SOLO", price: "$28,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?q=80&w=600" },
            { id: 7, name: "SPEEDMASTER", price: "$12,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1623998021446-45cd96e35f5a?q=80&w=600" },
            { id: 8, name: "HUBLOT BIG BANG", price: "$41,000", cat: "TIMEPIECE", img: "https://images.unsplash.com/photo-1622434641406-a158123450f9?q=80&w=600" },
            { id: 9, name: "TUXEDO VELVET", price: "$4,500", cat: "SARTORIAL", img: "https://images.unsplash.com/photo-1593030761757-71bd90dbe3a4?q=80&w=600" },
            { id: 10, name: "OXFORD BROGUE", price: "$1,200", cat: "FOOTWEAR", img: "https://images.unsplash.com/photo-1614252369475-531eba835eb1?q=80&w=600" },
            { id: 11, name: "SILK TIE SET", price: "$450", cat: "ACCESSORY", img: "https://images.unsplash.com/photo-1589756823695-278bc923f962?q=80&w=600" },
            { id: 12, name: "ITALIAN LOAFER", price: "$950", cat: "FOOTWEAR", img: "https://images.unsplash.com/photo-1533867617858-e7b97e060509?q=80&w=600" },
            { id: 13, name: "CASHMERE COAT", price: "$3,200", cat: "SARTORIAL", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=600" },
            { id: 14, name: "CHELSEA BOOT", price: "$890", cat: "FOOTWEAR", img: "https://images.unsplash.com/photo-1638247025967-b4e38f787b76?q=80&w=600" },
            { id: 15, name: "BESPOKE SUIT", price: "$6,000", cat: "SARTORIAL", img: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?q=80&w=600" },
            { id: 16, name: "LEATHER BRIEF", price: "$2,100", cat: "ACCESSORY", img: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?q=80&w=600" },
            { id: 17, name: "CUBAN LINK 18K", price: "$18,000", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1573408301185-9146fe634ad0?q=80&w=600" },
            { id: 18, name: "SIGNET ONYX", price: "$2,400", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1626036323602-0df5275811c7?q=80&w=600" },
            { id: 19, name: "SILVER CUFF", price: "$800", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=600" },
            { id: 20, name: "DIAMOND STUD", price: "$5,500", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1599643478518-17488fbbcd75?q=80&w=600" },
            { id: 21, name: "ROPE CHAIN", price: "$3,200", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1606760227091-3dd870d97f1d?q=80&w=600" },
            { id: 22, name: "EMERALD RING", price: "$12,500", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1605100804763-247f67b3557e?q=80&w=600" },
            { id: 23, name: "PLATINUM BAND", price: "$4,000", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1603561591411-07134e71a2a9?q=80&w=600" },
            { id: 24, name: "VINTAGE LOCKET", price: "$1,800", cat: "JEWELRY", img: "https://images.unsplash.com/photo-1611085583191-a3b181a88401?q=80&w=600" }
        ];

        // 1. Audio Activation
        function initAudio() {
            const audio = document.getElementById('main-audio');
            if(audio.paused) { audio.play(); audio.volume = 0.3; }
        }

        // 2. Tab Navigation with Animations
        function showPage(pageId) {
            gsap.to(".page", { opacity: 0, scale: 1.05, duration: 0.6, onComplete: () => {
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
                const target = document.getElementById(`page-${pageId}`);
                target.classList.add("active-page");
                gsap.fromTo(target, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 1.2, ease: "expo.out" });
            }});
        }

        // 3. Render Product Cards (Rolex Style)
        function renderCatalogue() {
            const grid = document.getElementById('master-grid');
            inventory.forEach((item, index) => {
                grid.innerHTML += `
                    <div class="product-card p-6 flex flex-col group opacity-0 translate-y-10" id="item-${index}">
                        <div class="relative overflow-hidden aspect-[4/5] bg-neutral-900 mb-6">
                            <img src="${item.img}" class="w-full h-full object-cover transition-transform duration-[2000ms] group-hover:scale-110 opacity-80 group-hover:opacity-100">
                            <div class="absolute inset-0 border border-ah-gold/0 group-hover:border-ah-gold/20 transition-all"></div>
                        </div>
                        <p class="text-[9px] tracking-[0.3em] text-ah-gold mb-2 uppercase">${item.cat}</p>
                        <h4 class="font-serif text-lg tracking-widest text-white mb-2">${item.name}</h4>
                        <div class="h-[1px] w-8 bg-ah-gold/30 mb-4 group-hover:w-full transition-all duration-700"></div>
                        <p class="font-sans text-xs text-gray-400 tracking-widest">${item.price}</p>
                    </div>
                `;
            });
            // Staggered Entry Animation
            gsap.to(".product-card", { opacity: 1, y: 0, stagger: 0.1, duration: 1, ease: "power3.out", delay: 2 });
        }

        // 4. Intro GSAP
        window.onload = () => {
            renderCatalogue();
            const tl = gsap.timeline();
            tl.to("#intro-wrap", { opacity: 1, scale: 1, duration: 2, ease: "power2.out" })
              .to("#line-draw", { width: "150px", duration: 1.5 }, "-=1")
              .to("#intro-overlay", { y: "-100%", duration: 1.5, ease: "expo.inOut", delay: 0.5 });
            
            gsap.from("#hero-title", { y: "100%", duration: 1.5, ease: "power4.out", delay: 3 });
        };

        // 5. Google AI Studio Integration
        async function askVault() {
            const input = document.getElementById('ai-input');
            const window = document.getElementById('chat-window');
            if(!input.value.trim()) return;

            const userMsg = input.value;
            input.value = "";
            window.innerHTML += `<div class="ml-auto bg-white/5 p-5 max-w-[70%] text-right font-sans text-sm text-ah-gold border-r border-ah-gold/40">${userMsg}</div>`;
            window.scrollTop = window.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AI_SYSTEM.key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `${AI_SYSTEM.instruction}\n\nUser Question: ${userMsg}` }] }]
                    })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                window.innerHTML += `<div class="bg-ah-gold/5 p-6 border-l-2 border-ah-gold max-w-[85%] text-gray-300 text-sm leading-relaxed opacity-0 animate-fade">${reply}</div>`;
                gsap.to(".animate-fade", { opacity: 1, duration: 1 });
                window.scrollTop = window.scrollHeight;
            } catch (err) {
                window.innerHTML += `<div class="text-[10px] text-red-800 uppercase tracking-widest text-center py-4">Security Protocol: Connection Interrupted</div>`;
            }
        }
    </script>
</body>
</html>
